# Keeps Casks/all-in-one-messenger-hub.rb on the newest release that has a DMG.
# Zero touch: runs every hour, does nothing when the cask is already current.
name: Update cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump to the newest release with a DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: doonfrs/all-in-one-messenger-hub-releases
          ASSET: AllInOneMessengerHub.dmg
          CASK: Casks/all-in-one-messenger-hub.rb
        run: |
          set -euo pipefail
          # Releases come newest first. Windows-only releases have no DMG, so skip them.
          tag=$(gh api "repos/$RELEASES/releases?per_page=30" --jq \
            "[.[] | select((.draft or .prerelease) | not) | select(any(.assets[]; .name == \"$ASSET\"))][0].tag_name")
          [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "No release with $ASSET"; exit 1; }
          version="${tag#v}"
          current=$(sed -nE 's/^  version "(.*)"$/\1/p' "$CASK")
          if [ "$version" = "$current" ]; then
            echo "Already on $version"
            exit 0
          fi
          curl -fsSL -o app.dmg "https://github.com/$RELEASES/releases/download/$tag/$ASSET"
          sha=$(sha256sum app.dmg | cut -d' ' -f1)
          rm app.dmg
          sed -i -E "s/^  version \".*\"$/  version \"$version\"/; s/^  sha256 \".*\"$/  sha256 \"$sha\"/" "$CASK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "all-in-one-messenger-hub $version"
          git push
